name: Build and Deploy Portal

on:
  push:
    branches:
      - main
      - staging
      - prod

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      DEV_ENV_FILE: ${{ secrets.DEV_ENV_FILE }}
      STAGING_ENV_FILE: ${{ secrets.STAGING_ENV_FILE }}
      PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Inject .env file
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then echo $DEV_ENV_FILE | base64 --decode > .env; fi
          if [ "$GITHUB_REF_NAME" = "staging" ]; then echo $STAGING_ENV_FILE | base64 --decode > .env; fi
          if [ "$GITHUB_REF_NAME" = "prod" ]; then echo $PROD_ENV_FILE | base64 --decode > .env; fi

      - name: Build project
        run: npm run build

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push Docker image
        run: |
          BRANCH=${GITHUB_REF##*/}
          IMAGE_NAME=ghcr.io/${{ github.repository }}:$BRANCH
          IMAGE_COMMIT=ghcr.io/${{ github.repository }}:${{ github.sha }}

          docker build -t $IMAGE_NAME -t $IMAGE_COMMIT .
          docker push $IMAGE_NAME
          docker push $IMAGE_COMMIT

      - name: Deploy to Dev
        if: github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.DEV_REMOTE_SERVER_ADDRESS }}
          username: ${{ secrets.DEV_SERVER_USERNAME }}
          key: ${{ secrets.DEV_REMOTE_SERVER_KEY }}
          port: ${{ secrets.DEV_SSH_PORT }}
          script: |
            echo ${{ secrets.GHCR_TOKEN }} | podman login ghcr.io -u ${{ secrets.GHCR_USERNAME }} --password-stdin
            sudo podman pull ghcr.io/${{ github.repository }}:main
            sudo podman stop portal || true
            sudo podman rm portal || true
            sudo podman run --name="portal" -p 9082:3000 -d ghcr.io/${{ github.repository }}:main

      - name: Deploy to Staging
        if: github.ref == 'refs/heads/staging'
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_REMOTE_SERVER_ADDRESS }}
          username: ${{ secrets.STAGING_SERVER_USERNAME }}
          key: ${{ secrets.STAGING_REMOTE_SERVER_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT }}
          script: |
            echo ${{ secrets.GHCR_TOKEN }} | podman login ghcr.io -u ${{ secrets.GHCR_USERNAME }} --password-stdin
            sudo podman pull ghcr.io/${{ github.repository }}:staging
            sudo podman stop portal || true
            sudo podman rm portal || true
            sudo podman run --name="portal" -p 9083:3000 -d ghcr.io/${{ github.repository }}:staging

      - name: Deploy to Production
        if: github.ref == 'refs/heads/prod'
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.PROD_REMOTE_SERVER_ADDRESS }}
          username: ${{ secrets.PROD_SERVER_USERNAME }}
          key: ${{ secrets.PROD_REMOTE_SERVER_KEY }}
          port: ${{ secrets.PROD_SSH_PORT }}
          script: |
            echo ${{ secrets.GHCR_TOKEN }} | podman login ghcr.io -u ${{ secrets.GHCR_USERNAME }} --password-stdin
            sudo podman pull ghcr.io/${{ github.repository }}:prod
            sudo podman stop portal || true
            sudo podman rm portal || true
            sudo podman run --name="portal" -p 9084:3000 -d ghcr.io/${{ github.repository }}:prod
